<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5541c"/>
    </marker>
  </defs>
  <rect width="1400" height="1000" fill="#ffffff"/>

  <text x="700" y="46" text-anchor="middle" font-size="36" font-weight="bold" fill="#1a1a1a">Enclosure boundary conditions (side view)</text>
  <text x="700" y="82" text-anchor="middle" font-size="22" fill="#555">Schematic, not to scale. Flow goes left to right.</text>

  <!-- domain fill and boundaries -->
  <rect x="260" y="200" width="740" height="420" fill="#eaf3fb"/>
  <line x1="260" y1="200" x2="1000" y2="200" stroke="#1f5fa8" stroke-width="8"/>
  <line x1="260" y1="620" x2="1000" y2="620" stroke="#1f5fa8" stroke-width="8"/>
  <line x1="260" y1="200" x2="260" y2="620" stroke="#1f5fa8" stroke-width="8"/>
  <line x1="1000" y1="200" x2="1000" y2="620" stroke="#b5541c" stroke-width="8"/>

  <!-- inlet arrows -->
  <g stroke="#1f5fa8" stroke-width="4" fill="none" marker-end="url(#arr)">
    <line x1="290" y1="260" x2="390" y2="250"/>
    <line x1="290" y1="335" x2="390" y2="325"/>
    <line x1="290" y1="410" x2="390" y2="400"/>
    <line x1="290" y1="485" x2="390" y2="475"/>
    <line x1="290" y1="560" x2="390" y2="550"/>
  </g>
  <!-- outlet arrows -->
  <g stroke="#b5541c" stroke-width="4" fill="none" marker-end="url(#arrO)">
    <line x1="870" y1="300" x2="970" y2="300"/>
    <line x1="870" y1="410" x2="970" y2="410"/>
    <line x1="870" y1="520" x2="970" y2="520"/>
  </g>

  <!-- wing -->
  <g transform="translate(480 415) rotate(-1.5) scale(1.15)">
    <path d="M0,0 C5,-30 80,-40 180,-30 C230,-24 255,-8 270,0 C255,7 230,12 180,14 C80,20 10,14 0,0 Z" fill="#4a4a4a" stroke="#111" stroke-width="3"/>
  </g>

  <!-- wing label (line stops at box edge) -->
  <rect x="510" y="250" width="240" height="72" rx="10" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <text x="630" y="282" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">WING (wingWall)</text>
  <text x="630" y="308" text-anchor="middle" font-size="19" fill="#333">wing-fluid interface</text>
  <line x1="630" y1="322" x2="630" y2="362" stroke="#333" stroke-width="3"/>

  <!-- top label -->
  <rect x="410" y="110" width="440" height="60" rx="10" fill="#1f5fa8"/>
  <text x="630" y="138" text-anchor="middle" font-size="25" font-weight="bold" fill="#fff">TOP (wallVelocity)</text>
  <text x="630" y="162" text-anchor="middle" font-size="19" fill="#fff">same velocity as inlet</text>
  <line x1="630" y1="170" x2="630" y2="196" stroke="#1f5fa8" stroke-width="4"/>

  <!-- bottom label -->
  <rect x="410" y="650" width="440" height="60" rx="10" fill="#1f5fa8"/>
  <text x="630" y="678" text-anchor="middle" font-size="25" font-weight="bold" fill="#fff">BOTTOM (wallVelocity)</text>
  <text x="630" y="702" text-anchor="middle" font-size="19" fill="#fff">same velocity as inlet</text>
  <line x1="630" y1="624" x2="630" y2="650" stroke="#1f5fa8" stroke-width="4"/>

  <!-- inlet label -->
  <rect x="20" y="370" width="200" height="80" rx="10" fill="#1f5fa8"/>
  <text x="120" y="405" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">INLET</text>
  <text x="120" y="434" text-anchor="middle" font-size="19" fill="#fff">velocity inlet</text>
  <line x1="220" y1="410" x2="256" y2="410" stroke="#1f5fa8" stroke-width="4"/>

  <!-- outlet label -->
  <rect x="1040" y="370" width="340" height="80" rx="10" fill="#b5541c"/>
  <text x="1210" y="405" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">OUTLET</text>
  <text x="1210" y="434" text-anchor="middle" font-size="19" fill="#fff">pressure outlet, 0 Pa gauge</text>
  <line x1="1004" y1="410" x2="1040" y2="410" stroke="#b5541c" stroke-width="4"/>

  <!-- values panel -->
  <rect x="20" y="750" width="1360" height="230" rx="12" fill="#f4f4f4" stroke="#ccc" stroke-width="2"/>

  <text x="50" y="795" font-size="26" font-weight="bold" fill="#1f5fa8">Inlet, top and bottom</text>
  <text x="50" y="835" font-size="22" fill="#222">Magnitude 25 m/s</text>
  <text x="50" y="870" font-size="22" fill="#222">Angle of attack 1 degree</text>
  <text x="50" y="905" font-size="22" fill="#222">Turbulence intensity 5%</text>
  <text x="50" y="940" font-size="22" fill="#222">Viscosity ratio 10</text>

  <text x="500" y="795" font-size="26" font-weight="bold" fill="#b5541c">Outlet</text>
  <text x="500" y="835" font-size="22" fill="#222">Gauge pressure 0 Pa</text>
  <text x="500" y="870" font-size="22" fill="#222">Backflow normal to boundary</text>
  <text x="500" y="905" font-size="22" fill="#222">Backflow intensity 5%</text>
  <text x="500" y="940" font-size="22" fill="#222">Backflow viscosity ratio 10</text>

  <text x="930" y="795" font-size="26" font-weight="bold" fill="#333">Wing</text>
  <text x="930" y="835" font-size="22" fill="#222">Stationary, no-slip wall</text>
  <text x="930" y="870" font-size="22" fill="#222">Roughness height 0 m (smooth)</text>
</svg>
